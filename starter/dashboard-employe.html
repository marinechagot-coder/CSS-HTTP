<!doctype html>
<!-- lang : langue de la page, utilisee par les lecteurs d'ecran et les moteurs de recherche. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Sans cette balise, le mobile affiche la page en version desktop dezoomee. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Titre unique par page : "Nom de la page - Nom du site". C'est ce qui
       s'affiche dans l'onglet, l'historique et les resultats de recherche. -->
    <title>Dashboard - TechCorp RH</title>
    <meta
      name="Dashboard"
      content="dashbord affichant les synthèses des informations."
    />

    <!-- Application interne : pas d'indexation par les moteurs de recherche. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/main.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu principal</a>

        >

            class="nav__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"

            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span class="sr-only">Ouvrir le menu</span>
        </button>

        <a class="brand" href="dashboard-employe.html">
          <img
            class="brand__logo"
            src="assets/logo.svg"
            alt=""
            width="32"
            height="32"
          />

        <div class="topbar__actions">
          <div class="user">
            <span class="avatar" aria-hidden="true">CM</span>
            <div class="user__info">
              <p class="user__name">Claire Martin</p>
              <p class="user__role">Développeuse</p>

      <nav

        <ul class="nav" role="list" aria-labelledby="nav-perso">

          <li>

          </li>
          <li>
            <a class="nav__link" href="note-frais-nouvelle.html"

          <li><a class="nav__link" href="materiel.html">Matériel</a></li>
          <li><a class="nav__link" href="profil.html">Mon profil</a></li>
        </ul>
      </nav>

      <main class="app__main" id="contenu" tabindex="-1">
        <div class="container">
          <!-- contenu de la page : étape 3 -->
        </div>

    </div>

</html>
